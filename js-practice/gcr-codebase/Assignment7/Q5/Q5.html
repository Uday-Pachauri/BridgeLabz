
<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Image Gallery</h1>

    <div class="gallery">
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=400" alt="Nature">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400" alt="Beach">
        <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=400" alt="Mountain">
        <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=400" alt="Lake">
        <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=400" alt="Sunrise">
        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=400" alt="Forest">
    </div>

    <div class="modal" id="modal">
        <div class="modal-content" id="modalContent">
            <span id="closeBtn">&times;</span>
            <img id="modalImage" src="" alt="Preview">
        </div>
    </div>

    <script src="Q5.js"></script>
</body>
</html>
