
<!DOCTYPE html>
<html>
<head>
    <title>Custom Dropdown</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Custom Dropdown</h1>

    <div class="dropdown" id="dropdown">
        <button id="dropdownButton">Select Option</button>

        <div id="dropdownOptions" class="options">
            <div class="option">Java</div>
            <div class="option">Python</div>
            <div class="option">JavaScript</div>
            <div class="option">C++</div>
        </div>
    </div>

    <script src="Q8.js"></script>
</body>
</html>
