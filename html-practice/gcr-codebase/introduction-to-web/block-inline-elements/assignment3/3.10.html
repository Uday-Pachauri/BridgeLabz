<!DOCTYPE html>
<html>
<head>
    <title>Selection Page</title>
</head>

<body>

    <h1>Dropdown Selection Page</h1>

    <p>Country:</p>
    <select>
        <option selected>India</option>
        <option>USA</option>
        <option>Canada</option>
    </select>

    <p>State:</p>
    <select>
        <option selected>Uttar Pradesh</option>
        <option>Delhi</option>
        <option>Rajasthan</option>
    </select>

    <p>City:</p>
    <select>
        <option selected>Agra</option>
        <option>Lucknow</option>
        <option>Delhi</option>
    </select>

    <p>Favorite Tourist Place:</p>
    <select>
        <option selected>Taj Mahal</option>
        <option>Goa</option>
        <option>Manali</option>
    </select>

    <p>My selected country is India, state is Uttar Pradesh, city is Agra and favorite tourist place is Taj Mahal.</p>

</body>
</html>
