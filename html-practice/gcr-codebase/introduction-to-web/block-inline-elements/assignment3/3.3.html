<!DOCTYPE html>
<html>
<head>
    <title>Course Registration</title>
</head>

<body>

    <h1>Course Registration Form</h1>

    <form>

        <fieldset>
            <legend>Student Details</legend>

            Name:
            <input type="text"><br><br>

            Email:
            <input type="email"><br><br>

            Select Course:
            <select>
                <option>Java</option>
                <option>HTML</option>
                <option>Python</option>
            </select>

        </fieldset>

    </form>

    <h2>Course Schedule</h2>

    <table border="5">

        <tr>
            <th>Day</th>
            <th>Time</th>
            <th>Instructor</th>
        </tr>

        <tr>
            <td>Monday</td>
            <td>10 AM</td>
            <td>Uday pachauri</td>
        </tr>

        <tr>
            <td>Wednesday</td>
            <td>12 PM</td>
            <td>Shivam mathur</td>
        </tr>

        <tr>
            <td>Friday</td>
            <td>2 PM</td>
            <td>Tejas agarwal</td>
        </tr>

    </table>

</body>
</html>
