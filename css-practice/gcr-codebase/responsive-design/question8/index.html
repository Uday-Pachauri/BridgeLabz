
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Image Filter Comparison</h1>
        <p>Compare Original and Filtered Images</p>
    </header>

    <main class="comparison">
        <figure>
            <img src="https://picsum.photos/id/1015/500/350" alt="Original mountain image">
            <figcaption>Before - Original Image</figcaption>
        </figure>

        <figure>
            <img class="filtered" src="https://picsum.photos/id/1015/500/350" alt="Filtered mountain image">
            <figcaption>After - Filtered Image</figcaption>
        </figure>
    </main>
</body>
</html>
