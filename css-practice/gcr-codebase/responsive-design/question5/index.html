
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Cards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Our Team</h1>
    </header>

    <main class="profiles">
        <section class="profile">
            <img src="https://picsum.photos/id/1005/300/250" alt="Alex">
            <h2>Alex</h2>
            <p>Web Designer</p>
        </section>

        <section class="profile">
            <img src="https://picsum.photos/id/1011/300/250" alt="Sam">
            <h2>Sam</h2>
            <p>Web Developer</p>
        </section>

        <section class="profile">
            <img src="https://picsum.photos/id/1027/300/250" alt="Jordan">
            <h2>Jordan</h2>
            <p>Cloud Engineer</p>
        </section>
    </main>
</body>
</html>
