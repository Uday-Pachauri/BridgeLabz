
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Filter Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Image Filter Gallery</h1>
    </header>

    <main class="gallery">
        <figure>
            <img class="blur" src="https://picsum.photos/id/1015/400/300" alt="Mountain">
            <figcaption>Blur Filter</figcaption>
        </figure>

        <figure>
            <img class="gray" src="https://picsum.photos/id/1016/400/300" alt="Nature">
            <figcaption>Grayscale Filter</figcaption>
        </figure>

        <figure>
            <img class="sepia" src="https://picsum.photos/id/1018/400/300" alt="Forest">
            <figcaption>Sepia Filter</figcaption>
        </figure>

        <figure>
            <img class="bright" src="https://picsum.photos/id/1020/400/300" alt="River">
            <figcaption>Brightness Filter</figcaption>
        </figure>

        <figure>
            <img class="contrast" src="https://picsum.photos/id/1024/400/300" alt="Animal">
            <figcaption>Contrast Filter</figcaption>
        </figure>

        <figure>
            <img class="hue" src="https://picsum.photos/id/1039/400/300" alt="Landscape">
            <figcaption>Hue Rotate Filter</figcaption>
        </figure>
    </main>
</body>
</html>
