
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="bg-dark text-white text-center p-5">
        <h1 class="fw-bold">Uday Pachauri</h1>
        <p class="lead">CSE Student | Cloud Computing Enthusiast</p>
    </header>

    <main class="container mt-4 mb-4">
        <section class="profile bg-light text-dark text-center p-5 rounded">
            <img src="https://picsum.photos/200" class="img-fluid rounded-circle profile-img" alt="Profile Photo">

            <h2 class="mt-4 mb-3 fw-bold">About Me</h2>
            <p>I am a Computer Science student interested in web development, Java and cloud computing. I enjoy learning new technologies and building useful projects.</p>

            <div class="mt-4">
                <a href="#contact" class="btn btn-primary me-2">Hire Me</a>
                <a href="cv.pdf" class="btn btn-outline-dark" download>Download CV</a>
            </div>
        </section>

        <section id="contact" class="container mt-5 mb-3">
            <h2 class="text-center fw-bold mb-4">Contact Me</h2>

            <form class="contact-form mx-auto">
                <div class="mb-3">
                    <label for="name" class="form-label">Your Name</label>
                    <input type="text" id="name" class="form-control" placeholder="Enter your name" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Your Email</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                </div>

                <div class="mb-3">
                    <label for="message" class="form-label">Message</label>
                    <textarea id="message" class="form-control" rows="4" placeholder="Write your message" required></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Send Message</button>
            </form>
        </section>
    </main>

    <footer class="bg-dark text-white text-center p-3 mt-5">
        <p class="mb-0">© 2026 Uday Pachauri | My Portfolio</p>
    </footer>
</body>
</html>
