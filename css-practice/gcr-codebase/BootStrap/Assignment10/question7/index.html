
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="bg-dark text-white p-4">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h3 mb-0">Task Tracker</h1>
            <span class="badge bg-warning text-dark fs-6">Pending: 4</span>
        </div>
    </header>

    <main class="container py-5">
        <section class="task-panel">
            <h2 class="mb-4">My Tasks</h2>

            <ul class="list-group">
                <li class="list-group-item d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <span>Complete Bootstrap Assignment</span>
                    <span class="badge bg-danger">High</span>
                </li>

                <li class="list-group-item d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <span>Practice Java DSA</span>
                    <span class="badge bg-warning text-dark">Medium</span>
                </li>

                <li class="list-group-item d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <span>Review CSS Notes</span>
                    <span class="badge bg-success">Low</span>
                </li>

                <li class="list-group-item d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <span>Update GitHub Repository</span>
                    <span class="badge bg-danger">High</span>
                </li>
            </ul>

            <div class="text-center mt-4">
                <button type="button" class="btn btn-primary">
                    Completed <span class="badge bg-light text-dark ms-2">0</span>
                </button>
            </div>
        </section>
    </main>

    <footer class="bg-dark text-white text-center p-3">
        <p class="mb-0">© 2026 Task Tracker</p>
    </footer>
</body>
</html>
