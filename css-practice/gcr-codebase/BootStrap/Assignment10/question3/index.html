
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="bg-dark text-white text-center p-4">
        <h1>Tech Store</h1>
        <p class="mb-0">Find the best products for you</p>
    </header>

    <main class="container py-5">
        <h2 class="text-center fw-bold mb-4">Our Products</h2>

        <div class="row g-4">
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card h-100 shadow-sm">
                    <img src="https://picsum.photos/seed/headphones/400/300" class="card-img-top" alt="Headphones">
                    <div class="card-body text-center">
                        <h5 class="card-title">Wireless Headphones</h5>
                        <p class="price">₹1,499</p>
                        <a href="#" class="btn btn-primary">Add to Cart</a>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card h-100 shadow-sm">
                    <img src="https://picsum.photos/seed/smartwatch/400/300" class="card-img-top" alt="Smartwatch">
                    <div class="card-body text-center">
                        <h5 class="card-title">Smart Watch</h5>
                        <p class="price">₹2,499</p>
                        <a href="#" class="btn btn-primary">Add to Cart</a>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card h-100 shadow-sm">
                    <img src="https://picsum.photos/seed/keyboard/400/300" class="card-img-top" alt="Keyboard">
                    <div class="card-body text-center">
                        <h5 class="card-title">Gaming Keyboard</h5>
                        <p class="price">₹1,199</p>
                        <a href="#" class="btn btn-primary">Add to Cart</a>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card h-100 shadow-sm">
                    <img src="https://picsum.photos/seed/speaker/400/300" class="card-img-top" alt="Speaker">
                    <div class="card-body text-center">
                        <h5 class="card-title">Bluetooth Speaker</h5>
                        <p class="price">₹999</p>
                        <a href="#" class="btn btn-primary">Add to Cart</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center p-3">
        <p class="mb-0">© 2026 Tech Store. All Rights Reserved.</p>
    </footer>
</body>
</html>
